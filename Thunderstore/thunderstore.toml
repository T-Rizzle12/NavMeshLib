[config]
schemaVersion = "0.0.1"

[general]
repository = "https://thunderstore.io"

[package]
description = "A helper NavMesh library for Lethal Company."
websiteUrl = "https://github.com/T-Rizzle12/NavMeshInCompanyRedux"
containsNsfwContent = false
[package.dependencies]
BepInEx-BepInExPack = "5.4.2305"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./Packages"

[[build.copy]]
source = "../bin/Release/netstandard2.1/NavMeshLib.dll"
target = "plugins/NavMeshLib/"

[[build.copy]]
source = "../bin/Release/netstandard2.1/NavMeshLib.xml"
target = "plugins/NavMeshLib/"

[[build.copy]]
source = "./CHANGELOG.md"
target = "/"

[publish]
communities = [ "lethal-company", ]
[publish.categories]
# Get the list of categories from https://thunderstore.io/api/experimental/community/lethal-company/category/
lethal-company = [ "bepinex", "libraries" ]
